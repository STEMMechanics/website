# Include inside the TLS server block whose root is this application's public/.
# Origin firewall must allow only the configured ingress addresses and management network.
# Never set a proxy cache for Laravel responses or private downloads.
location ^~ /build/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location = /push-sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /.well-known/security.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400";
}
location ~ /\. { deny all; }
location ~* ^/(?:vendor|storage/logs|storage/app|bootstrap|config|database|backups?|audits)(?:/|$) { deny all; }
location ~* \.(?:env|sql|sqlite|bak|log|ini|lock)$ { deny all; }
# If SMSFlow still uses a temporary query credential, suppress query strings
# in the live ingress access log for the exact /webhooks/smsflow location.
# This example intentionally does not define the application's PHP or proxy
# upstream. Add the matching header directive to the live PHP location:
#   fastcgi_hide_header X-Powered-By;  # direct PHP-FPM
#   proxy_hide_header X-Powered-By;    # HTTP upstream
# At the public edge, overwrite (never append untrusted incoming values):
# proxy_set_header Host $host;
# proxy_set_header X-Forwarded-For $remote_addr;
# proxy_set_header X-Forwarded-Proto $scheme;
# On staging, also add_header X-Robots-Tag "noindex, nofollow" always;
