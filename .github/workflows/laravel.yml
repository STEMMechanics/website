name: Laravel

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpunit:
    name: PHPUnit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: imagick, mbstring, fileinfo, zip, redis

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: /tmp/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        env:
          COMPOSER_CACHE_DIR: /tmp/composer-cache
        run: composer install -q --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-redis

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Prepare DomPDF directories
        run: |
          mkdir -p storage/fonts
          chmod -R 777 storage/fonts

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check test distribution
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: python3 .github/scripts/phpunit_shard.py --shard ${{ matrix.shard }} --count 4

      - name: Report slowest tests
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('storage/logs/phpunit.xml')
          if report.exists():
              tests = list(ET.parse(report).iter('testcase'))
              tests.sort(key=lambda test: float(test.get('time', '0')), reverse=True)
              lines = ['## Slowest PHPUnit tests', '', '| Seconds | Test |', '| ---: | --- |']
              for test in tests[:20]:
                  name = f"{test.get('classname', '')}::{test.get('name', '')}"
                  name = name.replace('|', '&#124;').replace('\n', ' ')
                  lines.append(f"| {float(test.get('time', '0')):.3f} | {name} |")
              summary = '\n'.join(lines) + '\n'
              print(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(summary)
          PYTHON

  mariadb_migrations:
    name: MariaDB migration smoke test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stemmechanics_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: imagick, mbstring, fileinfo, zip, redis, pdo_mysql

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: /tmp/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        env:
          COMPOSER_CACHE_DIR: /tmp/composer-cache
        run: composer install -q --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-redis

      - name: Generate key
        run: php artisan key:generate

      - name: Run MariaDB migrations
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stemmechanics_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

  laravel-tests:
    name: laravel-tests
    needs: [phpunit, mariadb_migrations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require PHPUnit shards and MariaDB migrations to pass
        env:
          SHARD_RESULT: ${{ needs.phpunit.result }}
          MIGRATION_RESULT: ${{ needs.mariadb_migrations.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$MIGRATION_RESULT" = success
